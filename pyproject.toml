[project]
name = "salesreport"
version = "1.0.0"
description = "Combine messy order exports (CSV/Excel) into one clean, formatted Excel report."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
